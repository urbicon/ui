<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1816" />
    <script>
      (() => {
        // Only explicit choices set a class; system mode leaves
        // `color-scheme: light dark` to follow the OS via light-dark().
        var t = localStorage.getItem('urbicon-theme');
        var d = document.documentElement;
        if (t === 'dark') {
          d.classList.add('dark');
        } else if (t === 'light') {
          d.classList.add('light');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="docs-editorial">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
