[changelog]
header = """# Changelog\n
All notable changes to this project will be documented in this file.
This changelog is automatically generated from [Conventional Commits](https://www.conventionalcommits.org).\n
"""
# The BREAKING note is truncated at 600 characters. git-cliff reads everything
# after a `BREAKING CHANGE:` token as that footer's value, and a squash-merge
# body is the concatenation of every commit in the PR — so a 20-commit PR
# produced a single 4348-character blockquote on one line (v8.1.0, before this).
# The cap is above every hand-written breaking note in the history bar two, and
# a note that needs more than 600 characters belongs in the migration docs the
# entry links to, not in the changelog line.
body = """
{#- The URL is spelled a second time in `postprocessors` below: a postprocessor
    is a plain regex replacement over the rendered text and sees no template
    context, and Tera has no regex to do the job here instead. A version heading
    links to the diff against its predecessor — the oldest release in the
    generated set has none and falls back to its tag. `git push --follow-tags`,
    which is what bump.sh prints, is what keeps the newest link from 404ing. -#}
{%- set repo = "https://github.com/urbicon/ui" -%}
{%- if version %}
{%- if previous.version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- endif %}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{%- if commit.footers %}
{%- for footer in commit.footers %}
{%- if footer.token == "BREAKING CHANGE" or footer.token == "BREAKING-CHANGE" %}
  > **BREAKING:** {{ footer.value | trim | replace(from="\n", to=" ") | replace(from="  ", to=" ") | truncate(length=600, end=" …") }}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor -%}
{% endfor -%}
"""
trim = true
# Issue and PR numbers reach the changelog as plain `(#N)`. GitHub autolinks
# those in issues, PRs and commit views, never inside a Markdown file, so the
# link has to be written. It is written here and not in `commit_preprocessors`:
# the BREAKING note above is truncated at 600 characters, and a link inserted
# before that cap spends the budget on URL text — the 8.4.0 RadioGroup note
# loses its closing clause that way. Requiring the parentheses is what leaves
# the pre-move `(Codeberg #25)` entries alone; they number another forge's
# issues. `/issues/N` redirects to `/pull/N`, so one form serves both.
postprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/urbicon/ui/issues/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^[a-z]+(\\(.+?\\))?!:", group = "Breaking Changes" },
    # A `BREAKING CHANGE:` paragraph is parsed out of the body into
    # `commit.footers` (the template above reads it from there), so a `body`
    # matcher never sees it — only a `footer` matcher does.
    { footer = "^BREAKING[ -]CHANGE", group = "Breaking Changes" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^chore: version bump", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
