name: Release

# Triggered when a `vX.Y.Z` tag lands on main (created by
# `bun run bump:{patch,minor,major}` followed by `git push --follow-tags`).
#
# TWO JOBS, ON PURPOSE.
#
#   gate     runs the full suite (lint, typecheck, unit, e2e) and PACKS the
#            tarballs. It installs the workspace, so third-party install
#            scripts run here — and it holds no publishing credential of any
#            kind.
#   publish  takes the packed tarballs as an artifact and uploads them. It does
#            not check out the repo and never runs `bun install`, so no
#            dependency code is in the process that can publish.
#
# That split is the point: before, a single job had `NPM_TOKEN` in its job-level
# `env`, which put it in scope for `bun install` and every `postinstall` script
# of every transitive dependency. Now the credential-bearing job runs three
# commands over files it did not build.
#
# AUTHENTICATION: npm trusted publishing (OIDC). No long-lived token — the job
# mints a short-lived, cryptographically signed credential bound to this
# repository AND this workflow file, which is useless anywhere else. Requires
# `id-token: write` (below), npm >= 11.5.1 and Node >= 22.14, and a trusted
# publisher configured per package on npmjs.com. Provenance attestations are
# published automatically; the `--provenance` flag is not needed.
#
# MIGRATION STATE (2026-08-01): the effective publisher today is still the Buny
# deploy on the deploy host, triggered by the same tag. This workflow does not
# publish until `NPM_TRUSTED_PUBLISHING` is set to `true` as a repository
# variable — that switch is what hands publishing from Buny to here, and it
# should be flipped only after the canary run described in the PR has proven
# OIDC works for our tarball path. Running both would mean two sources of truth
# for the same tag.
#
# The `NPM_TOKEN` fallback remains for the transition, guarded by its own
# secret being set. It is deliberately scoped to the publish job only, so even
# the fallback never sits in the same process as `bun install`.

on:
  push:
    tags:
      - 'v*'
  # Canary path: run the whole gate and pack, then stop before uploading.
  # `dry_run: true` (the default) proves the OIDC credential can be minted and
  # that npm accepts the tarball, without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and authenticate, but do not publish'
        type: boolean
        default: true
      only:
        description: 'Limit to one package dir (e.g. packages/shared-types). Empty = all.'
        type: string
        default: ''

jobs:
  gate:
    name: Build, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Build once: the publish step ships the package dist, and `check` (next)
      # type-checks every workspace incl. docs-app against that built dist +
      # the generated api.ts. (`build` here is `build:ts` + the app build, so a
      # separate `build:ts` before `check` would rebuild every package twice.)
      - name: Build
        run: bun run build

      # Last line of defence before an irreversible `npm publish`: a failed
      # declaration emit makes svelte-package omit that file's .d.ts and still
      # exit 0, so a release can ship silently untyped and break every
      # consumer's type-check. Runs before `check`, whose phantom errors would
      # otherwise bury the actual cause.
      - name: Declaration guard
        run: bun run types:guard

      - name: Type check
        run: bun run check

      - name: Run unit tests
        run: |
          bun --filter='@urbicon-ui/blocks' run test:run
          bun --filter='@urbicon-ui/i18n' run test:run
          bun --filter='@urbicon-ui/docs-gen' run test
          (cd packages/auth && bunx --bun vitest run)
          (cd packages/table && bunx --bun vitest run)
          (cd packages/mcp-server && bunx --bun vitest run)
          (cd packages/docs && bunx --bun vitest run)
          (cd packages/sveltekit-utils && bunx --bun vitest run)
          (cd packages/sv && bunx --bun vitest run)

      - name: Playwright e2e
        # `--grep-invert @pixel` for the same reason as in ci.yml: the linux
        # screenshot baselines are bound to the deploy host, not to a
        # GitHub runner. Excluding them here means a release tag is gated on
        # behaviour, not on font rendering.
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test --grep-invert @pixel

      # Everything the publish job needs, produced here where the workspace
      # exists: the tarballs, and a manifest naming them in publish order. The
      # publish job then needs neither a checkout nor node_modules.
      - name: Pack
        env:
          ONLY: ${{ inputs.only }}
        run: bun run scripts/pack-release.ts

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC credential. Without it npm falls back to token auth and,
      # with no token set, refuses to publish.
      id-token: write
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
      # Comma-separated package names this workflow owns while Buny still
      # publishes the rest. Empty = all, which is only correct once Buny
      # publishes none. This is what keeps the handover from racing: a package
      # belongs to exactly one publisher at a time.
      PUBLISH_ONLY: ${{ vars.NPM_PUBLISH_ONLY }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # Sparse checkout of the one script this job runs, and nothing else. A
      # full checkout would be harmless, but the narrower the tree in the
      # credential-bearing job, the smaller the claim it has to make.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-tarballs.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs

      # Node from setup-node, not from bun: trusted publishing is an npm CLI
      # feature and needs >= 11.5.1 on Node >= 22.14. A runner whose preinstalled
      # npm is older would silently fall back to token auth — and with no token
      # set, to no auth at all — so the version is asserted rather than assumed.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Assert npm supports trusted publishing
        run: |
          set -euo pipefail
          echo "npm $(npm --version) on node $(node --version)"
          npm --version | awk -F. '
            ($1 > 11) || ($1 == 11 && ($2 > 5 || ($2 == 5 && $3 >= 1))) { exit 0 }
            { print "npm >= 11.5.1 required for OIDC trusted publishing"; exit 1 }
          '

      # The one part of OIDC that IS testable without publishing: whether the
      # job can mint a credential at all. `id-token: write` is what puts these
      # two variables in the environment; without the permission they are unset
      # and npm would silently fall back to token auth. Checked before the
      # publish step so a missing permission fails with its own name on it.
      #
      # What this does NOT prove is that npmjs.com accepts the credential —
      # that needs a trusted publisher configured for the package, and it only
      # shows on a real publish. See the rollout order in the PR description.
      - name: Verify the OIDC credential can be minted
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC environment — the job is missing 'permissions: id-token: write'"
            exit 1
          fi
          AUD='npm:registry.npmjs.org'
          CODE=$(curl -sS -o /tmp/oidc.json -w '%{http_code}' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}")
          if [ "$CODE" != "200" ]; then
            echo "::error::OIDC token request returned HTTP $CODE"
            exit 1
          fi
          # Print the claims that decide the trust match, never the token.
          node -e '
            const { value } = require("/tmp/oidc.json");
            const c = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString());
            console.log("OIDC ok — repository:", c.repository);
            console.log("             workflow_ref:", c.workflow_ref);
            console.log("             ref:", c.ref, "| event:", c.event_name);
          '
          rm -f /tmp/oidc.json

      - name: Publish
        run: node scripts/publish-tarballs.mjs
        env:
          # Only consulted when trusted publishing is off or unavailable — see
          # the fallback note in the header. Scoped to this step, not the job.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
