name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only ever reads the tree — checkout, install, build, test. The
# default token is read/write on a push event, so this has to be narrowed
# explicitly or a compromised step could write to the repo.
#
# Belt AND braces: the workflow-level block below is the floor for any job added
# later without one, and every job states its own as well. The duplication is
# the point — `actions/missing-workflow-permissions` flags a job that only
# inherits, because whoever widens the workflow block later widens every job
# with it, silently. A job that genuinely needs more (a comment, a status,
# `id-token` for OIDC as in release.yml) declares it where it is used, and that
# declaration REPLACES this one rather than adding to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Dead-token guard over every tv() config — the compensating control
      # for the fold semantics ("axis order is semantic"), where a
      # mis-ordered axis strips classes without any runtime error.
      - run: bun run variants:lint
      # The livery shim re-declares every ramp-derived semantic token; it is
      # generated from semantic.css and went stale twice in one week when that
      # file gained tokens. Fails when semantic.css changed without a regen.
      - run: bun run livery:check
      # The CSS token reference (`urbicon css-reference`, `get_css_reference`)
      # renders its surface/text/border tables and the intent roles from a
      # module generated out of semantic.css (#402). Fails when semantic.css
      # or foundation.css changed without a regen.
      - run: bun run tokens:reference:check
      # Cross-component import guard: public blocks components must reach for
      # the behaviour-only cores in src/lib/internal/core instead of importing
      # each other. Unknown edges AND stale allowlist entries both fail.
      - run: bun run imports:lint
      # Icon geometry contract + the 5-spot registration checklist. An icon
      # registered in four of five places renders nothing, silently.
      - run: bun run icons:lint
      # Source-level i18n audit: unused keys, used-but-undefined keys,
      # hardcoded strings. Advisory findings do not fail; errors do.
      - run: bun run i18n:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `check` runs over every workspace incl. the consumer apps (docs-app),
      # which type-check against the built package dist + generated api.ts.
      # `build:ts` produces both, so it must run before `check` can gate.
      - run: bun run build:ts
      # Declaration-emit guard, deliberately between `build:ts` and `check`:
      # svelte-package drops a file's .d.ts on a failed declaration emit while
      # still exiting 0, which surfaces in `check` as hundreds of phantom errors
      # in unrelated components (274 of them on 2026-07-09). Running it here
      # names the one missing file first. It cannot live in the `build` job —
      # that job `needs: [typecheck]`, so a drop would fail `check` and skip the
      # guard entirely, in exactly the case it exists for.
      - run: bun run types:guard
      - run: bun run check

  gates:
    # Separate from `typecheck` although both start with `build:ts`: these four
    # gates are the slow half (examples:lint alone runs two svelte-check passes
    # per package), and a type error should surface without waiting behind
    # them. Duplicating the build across jobs is the established trade-off here
    # — see the note on the e2e job.
    name: Docs & catalog gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # All of these read generated output, which `build:ts` produces in its
      # closing `docs:gen:ci` step — they cannot run before it.
      - run: bun run build:ts
      # The generated A2UI axes file vs. its source of truth. Drift here means
      # the A2UI catalog advertises props the components no longer take. Lives
      # here rather than in `lint` because it reads the design-content catalogue,
      # which is a build artefact.
      - run: bun run a2ui:axes:check
      # Component @summary budget.
      - run: bun run summary:lint
      # A docs page is hand-registered in three places (sidebar, componentLinks,
      # recipes cookbook); forgetting one is silent — the page vanishes from the
      # sidebar and @related chips to it are dropped without a word.
      - run: bun run registry:lint
      # Playground snippets + the knob-hint budget.
      - run: bun run playgrounds:lint
      # Every DocsLayout page hand-maintains a `navigation` array next to
      # hand-written section ids, and all three failure directions are silent:
      # a TOC link that scrolls nowhere, a section unreachable from the TOC,
      # and a nav whose order disagrees with the page under it.
      - run: bun run sections:lint
      # A component page documents its types in two hand-written halves —
      # `<TypesReference>` and `types=` on `<ApiReference>` — and each half
      # fails silently alone: without the prop every type name in the API table
      # is dead text, without the section every link it emits points at a
      # section that does not exist. Reads the generated api.ts, so it needs the
      # build:ts above. NOT `types:guard` (declaration emit, in `typecheck`).
      - run: bun run typesref:lint
      # The 2-4 CodeExample budget per component page. It lived only as prose in
      # DocsPageGuide.md until 2026-08 and the corpus had drifted to 17 pages
      # over the ceiling and 2 under the floor. Reads nothing generated, so it
      # does not need the build steps above.
      - run: bun run examples:budget
      # The design linter this project sells, applied to the project's own
      # markup. Correctness gates unconditionally. The craft floor is set to
      # the current worst file rather than to an aspiration, so it forbids
      # regression without demanding work nobody has scheduled: measured
      # 2026-08, apps/docs is 432 files at 100, 24 at 90, 3 at 80, 1 at 70;
      # packages/docs is 12 at 100.
      - run: bun packages/design/dist/cli.js validate packages/docs/src/lib/components --craft-floor 100
      - run: bun packages/design/dist/cli.js validate apps/docs/src --craft-floor 70
      # Type-checks every @example block in every *Props JSDoc. Those snippets
      # are served to the MCP catalogue, llm.txt and the docs site at once, so a
      # wrong one is wrong in three places.
      - run: bun run examples:lint
      # Compiles the opted-in `ts` fences of the shipped Markdown docs (package
      # READMEs, the six tarball docs) with tsc, resolved through the published
      # exports maps into what each package publishes — the dist/ the build:ts
      # above produced, or src/ where the map points there — the way a consumer
      # sees them. Nothing else compiles those blocks.
      - run: bun run docs:fences:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The unit suites import across workspace boundaries, so they need the
      # dependencies built — without this, blocks' tests fail to resolve
      # @urbicon-ui/i18n and the job is red for a reason that has nothing to do
      # with the code under test. This job ran without it for as long as the
      # workflow existed; it simply never executed, because origin was Codeberg.
      - run: bun run build:ts
      # The consumer-CSS gate's positive controls (the gate itself runs in
      # `build`): packs dist/ like the gate, then reproduces the pre-#314
      # `@source` lines on the unpacked copies and expects that finding back
      # by class and file. Without this the gate is green for any reason.
      - run: bun test scripts/consumer-css-check.test.ts
      - run: bun --filter='@urbicon-ui/blocks' run test:run
      - run: bun --filter='@urbicon-ui/i18n' run test:run
      - run: bun --filter='@urbicon-ui/docs-gen' run test
      - name: Test auth
        working-directory: packages/auth
        run: bunx --bun vitest run
      - name: Test table
        working-directory: packages/table
        run: bunx --bun vitest run
      - name: Test mcp-server
        working-directory: packages/mcp-server
        run: bunx --bun vitest run
      # design + design-engine were missing until 2026-07-31, which is how a
      # severity change in design-engine's linter shipped a red `design` suite
      # past a green CI run: `urbicon validate`'s own gate tests live in `design`
      # and nothing here executed them. These two carry the design loop the
      # project sells, so they belong in the same list as the rest.
      - name: Test design-engine
        working-directory: packages/design-engine
        run: bunx --bun vitest run
      - name: Test design
        working-directory: packages/design
        run: bunx --bun vitest run
      - name: Test sv add-on
        working-directory: packages/sv
        run: bunx --bun vitest run
      - name: Test docs
        working-directory: packages/docs
        run: bunx --bun vitest run
      - name: Test sveltekit-utils
        working-directory: packages/sveltekit-utils
        run: bunx --bun vitest run
      # The last two off the list, found by counting `"test"` scripts against
      # this job (2026-08). docs-app carries the rules the docs lints are built
      # on — the playground-lint rule table, the translation parity check, the
      # theme-example checks — so its 132 tests guard the guards.
      # `svelte-kit sync` first: apps/docs/tsconfig.json extends
      # `./.svelte-kit/tsconfig.json`, which is generated and git-ignored. Vitest's
      # transform reads that tsconfig, so without the sync every one of the ten
      # test files dies with `[TSCONFIG_ERROR] Tsconfig not found` before a single
      # assertion runs. It passes locally only because a previous dev/build run
      # left `.svelte-kit/` lying around — a clean checkout has none.
      - name: Test docs-app
        working-directory: apps/docs
        run: |
          bunx --bun svelte-kit sync
          bunx --bun vitest run
      - name: Test design-content
        working-directory: packages/design-content
        run: bunx --bun vitest run

  e2e:
    # Independent of `build` — each job installs + builds its own workspace, so
    # gating would just serialise two identical installs without sharing the
    # build artefact. Keeping the job parallel cuts ~3 min off CI.
    #
    # SHARDED across four runners. Measured on this repo: the suite was the
    # slowest job in CI at 9m07s, and raising the worker count inside ONE runner
    # made it worse — 4 workers on a 4-vCPU box went to 8m0s with 4 failed and 2
    # flaky, because the single dev server starves (see playwright.config.ts).
    # More runners means more dev servers, which is the parallelism the workers
    # could not buy.
    #
    # Four rather than three because `--shard` splits by test COUNT, not by
    # duration: at three the counts came out even (43/37/40) and the times did
    # not (294s/110s/110s). `a11y.spec.ts` is the reason — its route scans are
    # the ten slowest tests in the suite (24.7s for `tab` alone, 118s for the
    # top ten, 28% of 426s total) and they sort together into one slice. A
    # fourth cut splits that block instead of isolating it.
    #
    # A bonus that matters here: `auth.spec.ts` drives shared in-memory state on
    # the dev server and pins `mode: 'serial'` for it. Sharding gives each shard
    # its own server, so that isolation gets stronger, not weaker.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # PINNED IMAGE, so that a screenshot means something. The `@pixel` tests used
    # to be excluded here because the baselines were host-bound: generated on the
    # deploy host, compared on a GitHub runner, and every shot drifted on font
    # rasterisation alone. The runner is not the problem — an unpinned rendering
    # environment is. This image fixes fontconfig, FreeType and the browser build,
    # so a baseline generated in it reproduces in it, on any machine.
    #
    # The tag is written out rather than derived, and it cannot drift silently:
    # the browser-install step below is gone, so `/ms-playwright` holds exactly
    # one Chromium and Playwright fails loudly ("Executable doesn't exist at
    # /ms-playwright/chromium-<rev>") the moment the workspace expects another.
    # That is Playwright's own check, not a hand-written one — and it stays quiet
    # across a patch bump that ships the same browser build, which is the correct
    # sensitivity: it fires when the rendering can actually change.
    #
    # THE SAME TAG APPEARS IN e2e-baselines.yml and the two have to move
    # together: one image generates the baselines, this one compares them. The
    # duplication is deliberately left rather than gated — a gate keeping two
    # hand-written copies of one string agreeing is the shape AGENTS.md argues
    # against, and this pair cannot drift quietly anyway. Different tags means
    # different rendering, which means every shot red on the next run.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: read
    strategy:
      # One red shard must not cancel the others: knowing whether a failure is
      # local to one slice or spread across all of them is most of the diagnosis.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      # `oven-sh/setup-bun` unpacks a .zip and the Playwright image ships no
      # unzip. Nothing else in the job needs apt, so this is the whole delta the
      # container costs on the tooling side.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # No `playwright install` and no browser cache: the image already carries
      # the browser this Playwright expects, and installing over it would defeat
      # the pin — a workspace/image version drift would quietly download the
      # matching build instead of failing, which is the silent case the container
      # exists to remove. See the note on `container` above.
      # The 26 `@pixel` tests RUN here. They were excluded until the baselines
      # matched this image: the committed set came from the deploy host, so
      # every shot would have drifted against the container, and
      # `visual-regression-interaction` had no linux baselines at all (0 against
      # 48 under darwin) — it would have written them on first run rather than
      # compared. Both halves are now generated in this image by
      # `e2e-baselines.yml` and committed, 154 per platform.
      #
      # That workflow stays the only supported way to regenerate them: it runs
      # on a native amd64 runner, which an Apple-Silicon machine cannot
      # reproduce under emulation with any confidence, and these shots compare
      # at `threshold: 0` where one pixel is a failure. Re-baselining by hand
      # from a laptop is how the drift got in.
      #
      # The `@pixel` tag stays on the tests. It is what makes the regeneration
      # workflow able to select them, and it keeps the option of subtracting
      # them again in one place rather than by file.
      - run: bunx playwright test --shard=${{ matrix.shard }}/4
        env:
          # Switches the reporter to `blob`, the only format `merge-reports`
          # can recombine. See playwright.config.ts.
          PLAYWRIGHT_BLOB_REPORT: '1'

      - uses: actions/upload-artifact@v7
        # `!cancelled()` rather than `always()`: a failed shard is exactly the
        # one whose report is worth having, but a cancelled run has nothing to
        # say.
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Three shards produce three partial reports, which are unreadable separately.
  # This stitches them into the single HTML report the suite used to emit.
  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately NOT gated on lint/typecheck/test any more. That `needs:`
    # existed to avoid spending runner minutes on a build behind a red suite —
    # but standard runners are free on public repositories, and it put this job
    # at the END of a serial chain: `test` 4m28s, then `build` 6m32s, and CI
    # took 11m12s while every other job sat idle. Unchained it runs beside them
    # and the whole workflow is bounded by its slowest job instead of by a
    # queue. The cost of a build that turns out to be moot is nothing here.
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Per-component tree-shaken gzip against bundle-size.baseline.json.
      # Needs the blocks/table/auth dist that `build` just produced. Tolerance
      # is max(256 B, 3 %), so it measures intent, not machine noise.
      - run: bun run size --check
      # Consumer-CSS gate: packs every published package that ships `.svelte`,
      # installs the tarballs into a throwaway node_modules and asks Tailwind's
      # own compiler + scanner whether the shipped stylesheet reaches every
      # class in the shipped markup. apps/docs cannot catch this — it scans
      # every src/lib whole and is not a consumer (#314). Needs the dist that
      # `build` just produced; its positive controls run in the `test` job.
      - run: bun run consumer-css:check

      # Bundles the MCP server into a self-contained mcp-dist/ (server.js plus
      # the content it reads at runtime). Needs the docs:gen output that
      # `build` produced — the script asserts that rather than assuming it.
      - run: bun run build:mcp-dist

      # THE DEPLOY ARTEFACTS. deploy.yml pulls these from this run by id
      # instead of rebuilding, so a push that reaches production is byte-for-byte
      # the tree CI went green on. Three days is well past any useful re-run.
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: apps/docs/dist/
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-dist
          path: mcp-dist/
          retention-days: 3
          if-no-files-found: error

  # THE ONE REQUIRED CHECK. Branch protection names this job and nothing else,
  # so the shard count can go from four to six and a gate can be added, renamed
  # or dropped without anyone touching the ruleset. That matters more than it
  # sounds: a required check that no job reports any more stays "expected"
  # forever and blocks every pull request, with no failure anywhere to explain
  # why. Naming nine jobs individually is nine chances to hit that.
  #
  # `if: always()` is what makes this a gate rather than a decoration. Without
  # it the job is skipped as soon as a dependency fails — and a skipped required
  # check does not read as "failed" to branch protection, so a red suite would
  # merge. With it the job runs regardless and the step below decides.
  #
  # `e2e-report` is deliberately NOT a dependency: it only stitches the shard
  # artefacts into one HTML report and carries `if: !cancelled()`, so it goes
  # green over a red suite. `e2e` here is the matrix itself, whose aggregate
  # result is `failure` if any shard failed (`fail-fast: false` lets them all
  # finish first).
  ci-green:
    name: CI green
    needs: [lint, typecheck, gates, test, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    # Reports nothing, reads nothing, checks nothing out.
    permissions: {}
    steps:
      - name: Every gate must have succeeded
        # Both values go through `env:` rather than into the script text. Nothing
        # here is attacker-controlled today, but a `run:` that interpolates an
        # expression directly is the shape workflow injections take, and the
        # habit is worth keeping even where the input is a job result.
        env:
          NEEDS: ${{ toJSON(needs) }}
          # `skipped` counts as red too: no job in this workflow is conditional,
          # so a skip means something upstream did not run as intended.
          ANY_NOT_GREEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          if [ "$ANY_NOT_GREEN" = "true" ]; then
            echo "::error::At least one CI gate did not succeed — see the jobs above."
            exit 1
          fi
          echo "All gates green."
