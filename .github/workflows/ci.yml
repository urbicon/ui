name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only ever reads the tree — checkout, install, build, test. The
# default token is read/write on a push event, so this has to be narrowed
# explicitly or a compromised step could write to the repo.
#
# Belt AND braces: the workflow-level block below is the floor for any job added
# later without one, and every job states its own as well. The duplication is
# the point — `actions/missing-workflow-permissions` flags a job that only
# inherits, because whoever widens the workflow block later widens every job
# with it, silently. A job that genuinely needs more (a comment, a status,
# `id-token` for OIDC as in release.yml) declares it where it is used, and that
# declaration REPLACES this one rather than adding to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Dead-token guard over every tv() config — the compensating control
      # for the fold semantics ("axis order is semantic"), where a
      # mis-ordered axis strips classes without any runtime error.
      - run: bun run variants:lint
      # Cross-component import guard: public blocks components must reach for
      # the behaviour-only cores in src/lib/internal/core instead of importing
      # each other. Unknown edges AND stale allowlist entries both fail.
      - run: bun run imports:lint
      # Icon geometry contract + the 5-spot registration checklist. An icon
      # registered in four of five places renders nothing, silently.
      - run: bun run icons:lint
      # Source-level i18n audit: unused keys, used-but-undefined keys,
      # hardcoded strings. Advisory findings do not fail; errors do.
      - run: bun run i18n:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `check` runs over every workspace incl. the consumer apps (docs-app),
      # which type-check against the built package dist + generated api.ts.
      # `build:ts` produces both, so it must run before `check` can gate.
      - run: bun run build:ts
      # Declaration-emit guard, deliberately between `build:ts` and `check`:
      # svelte-package drops a file's .d.ts on a failed declaration emit while
      # still exiting 0, which surfaces in `check` as hundreds of phantom errors
      # in unrelated components (274 of them on 2026-07-09). Running it here
      # names the one missing file first. It cannot live in the `build` job —
      # that job `needs: [typecheck]`, so a drop would fail `check` and skip the
      # guard entirely, in exactly the case it exists for.
      - run: bun run types:guard
      - run: bun run check

  gates:
    # Separate from `typecheck` although both start with `build:ts`: these four
    # gates are the slow half (examples:lint alone runs two svelte-check passes
    # per package), and a type error should surface without waiting behind
    # them. Duplicating the build across jobs is the established trade-off here
    # — see the note on the e2e job.
    name: Docs & catalog gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # All of these read generated output, which `build:ts` produces in its
      # closing `docs:gen:ci` step — they cannot run before it.
      - run: bun run build:ts
      # The generated A2UI axes file vs. its source of truth. Drift here means
      # the A2UI catalog advertises props the components no longer take. Lives
      # here rather than in `lint` because it reads the design-content catalogue,
      # which is a build artefact.
      - run: bun run a2ui:axes:check
      # Component @summary budget.
      - run: bun run summary:lint
      # A docs page is hand-registered in three places (sidebar, componentLinks,
      # recipes cookbook); forgetting one is silent — the page vanishes from the
      # sidebar and @related chips to it are dropped without a word.
      - run: bun run registry:lint
      # Playground snippets + the knob-hint budget.
      - run: bun run playgrounds:lint
      # Type-checks every @example block in every *Props JSDoc. Those snippets
      # are served to the MCP catalogue, llm.txt and the docs site at once, so a
      # wrong one is wrong in three places.
      - run: bun run examples:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The unit suites import across workspace boundaries, so they need the
      # dependencies built — without this, blocks' tests fail to resolve
      # @urbicon-ui/i18n and the job is red for a reason that has nothing to do
      # with the code under test. This job ran without it for as long as the
      # workflow existed; it simply never executed, because origin was Codeberg.
      - run: bun run build:ts
      - run: bun --filter='@urbicon-ui/blocks' run test:run
      - run: bun --filter='@urbicon-ui/i18n' run test:run
      - run: bun --filter='@urbicon-ui/docs-gen' run test
      - name: Test auth
        working-directory: packages/auth
        run: bunx --bun vitest run
      - name: Test table
        working-directory: packages/table
        run: bunx --bun vitest run
      - name: Test mcp-server
        working-directory: packages/mcp-server
        run: bunx --bun vitest run
      # design + design-engine were missing until 2026-07-31, which is how a
      # severity change in design-engine's linter shipped a red `design` suite
      # past a green CI run: `urbicon validate`'s own gate tests live in `design`
      # and nothing here executed them. These two carry the design loop the
      # project sells, so they belong in the same list as the rest.
      - name: Test design-engine
        working-directory: packages/design-engine
        run: bunx --bun vitest run
      - name: Test design
        working-directory: packages/design
        run: bunx --bun vitest run
      - name: Test sv add-on
        working-directory: packages/sv
        run: bunx --bun vitest run
      - name: Test docs
        working-directory: packages/docs
        run: bunx --bun vitest run
      - name: Test sveltekit-utils
        working-directory: packages/sveltekit-utils
        run: bunx --bun vitest run

  e2e:
    # Independent of `build` — each job installs + builds its own workspace, so
    # gating would just serialise two identical installs without sharing the
    # build artefact. Keeping the job parallel cuts ~3 min off CI.
    #
    # SHARDED across four runners. Measured on this repo: the suite was the
    # slowest job in CI at 9m07s, and raising the worker count inside ONE runner
    # made it worse — 4 workers on a 4-vCPU box went to 8m0s with 4 failed and 2
    # flaky, because the single dev server starves (see playwright.config.ts).
    # More runners means more dev servers, which is the parallelism the workers
    # could not buy.
    #
    # Four rather than three because `--shard` splits by test COUNT, not by
    # duration: at three the counts came out even (43/37/40) and the times did
    # not (294s/110s/110s). `a11y.spec.ts` is the reason — its route scans are
    # the ten slowest tests in the suite (24.7s for `tab` alone, 118s for the
    # top ten, 28% of 426s total) and they sort together into one slice. A
    # fourth cut splits that block instead of isolating it.
    #
    # A bonus that matters here: `auth.spec.ts` drives shared in-memory state on
    # the dev server and pins `mode: 'serial'` for it. Sharding gives each shard
    # its own server, so that isolation gets stronger, not weaker.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One red shard must not cancel the others: knowing whether a failure is
      # local to one slice or spread across all of them is most of the diagnosis.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # ~120 MB per shard, three shards, every push. Keyed on the resolved
      # Playwright version so a bump re-downloads instead of testing against a
      # stale binary.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` still runs on a cache hit: the apt libraries the browser
      # links against live outside the cached path.
      - run: bunx playwright install --with-deps chromium
      # `--grep-invert @pixel` drops the 26 screenshot-comparing tests (of 146)
      # across visual-regression, visual-regression-interaction, floating and
      # the `Guide — visual` block. NOT because pixel tests do not belong in CI,
      # but because these baselines are host-bound: the -chromium-linux set was
      # generated on the deploy host on purpose — the machine that would run
      # them — rather than matched to some CI renderer. A GitHub runner is a
      # different machine, so every shot would drift on font rendering alone and
      # the suite would be red for a reason that says nothing about the code.
      # visual-regression-interaction has no linux baselines at all and would
      # write them on first run.
      #
      # Tagging (rather than excluding whole files) keeps guide.spec.ts's 15
      # functional tests in CI; only its 3 screenshot tests sit out.
      #
      # Locally and on the deploy host, a bare `bunx playwright test` still runs
      # everything — the tag only ever subtracts here.
      - run: bunx playwright test --grep-invert @pixel --shard=${{ matrix.shard }}/4
        env:
          # Switches the reporter to `blob`, the only format `merge-reports`
          # can recombine. See playwright.config.ts.
          PLAYWRIGHT_BLOB_REPORT: '1'

      - uses: actions/upload-artifact@v7
        # `!cancelled()` rather than `always()`: a failed shard is exactly the
        # one whose report is worth having, but a cancelled run has nothing to
        # say.
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Three shards produce three partial reports, which are unreadable separately.
  # This stitches them into the single HTML report the suite used to emit.
  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately NOT gated on lint/typecheck/test any more. That `needs:`
    # existed to avoid spending runner minutes on a build behind a red suite —
    # but standard runners are free on public repositories, and it put this job
    # at the END of a serial chain: `test` 4m28s, then `build` 6m32s, and CI
    # took 11m12s while every other job sat idle. Unchained it runs beside them
    # and the whole workflow is bounded by its slowest job instead of by a
    # queue. The cost of a build that turns out to be moot is nothing here.
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Per-component tree-shaken gzip against bundle-size.baseline.json.
      # Needs the blocks/table/auth dist that `build` just produced. Tolerance
      # is max(256 B, 3 %), so it measures intent, not machine noise.
      - run: bun run size --check
